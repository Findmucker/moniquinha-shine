<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Aprovar testemunho · Moniquinha Shine</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #28375b; background: #f7f9fe; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { background: #2b4178; padding: 22px; text-align: center; }
    header a { color: #fff; text-decoration: none; font-size: 1.2rem; font-weight: 800; }
    header img { width: 30px; vertical-align: middle; margin-right: 10px; }
    main { width: min(92%, 660px); margin: 48px auto; padding: 36px; border: 1px solid #dfe5f2; border-radius: 26px; background: #fff; box-shadow: 0 18px 48px #2d416f17; }
    h1 { margin: 0 0 14px; font-size: clamp(1.5rem, 4vw, 2.1rem); color: #2b4178; }
    .star { color: #e8a845; font-size: 1.5rem; }
    dl { display: grid; grid-template-columns: 135px 1fr; gap: 12px 18px; margin: 26px 0; }
    dt { font-weight: 700; } dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .private { background: #fff8eb; padding: 12px 16px; border-radius: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    button { border: 0; border-radius: 30px; padding: 13px 22px; font: inherit; font-weight: 750; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #approve { background: #e8a845; color: #253354; }
    #delete { background: #fce9e7; color: #8b3030; }
    button:focus-visible { outline: 3px solid #3d5a99; outline-offset: 3px; }
    #status { min-height: 24px; font-weight: 600; }
    @media (max-width: 500px) { main { padding: 25px 20px; } dl { grid-template-columns: 1fr; gap: 4px; } dd { margin-bottom: 12px; } }
  </style>
</head>
<body>
  <header><a href="/"><img src="/moniquinha-star.svg" alt="">Moniquinha Shine</a></header>
  <main>
    <h1>Rever testemunho ✨</h1>
    <p id="status" role="status">A carregar testemunho…</p>
    <section id="review" hidden>
      <dl>
        <dt>Nome</dt><dd id="name"></dd>
        <dt>Avaliação</dt><dd id="rating" class="star"></dd>
        <dt>Serviço</dt><dd id="service"></dd>
        <dt>Comentário</dt><dd id="comment"></dd>
        <dt>Contacto privado</dt><dd id="contact" class="private"></dd>
      </dl>
      <p id="hint"></p>
      <div class="actions"><button id="approve" type="button">Publicar testemunho</button><button id="delete" type="button">Apagar testemunho</button></div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    const reviewsEndpoint = 'https://vpdovbwljwtlqhnqefwo.supabase.co/functions/v1/reviews';
    const id = params.get('id');
    const token = params.get('token');
    const status = document.getElementById('status');
    const section = document.getElementById('review');
    const approve = document.getElementById('approve');
    const remove = document.getElementById('delete');
    const serviceNames = {
      cleaning: '🧹 Limpeza regular', 'deep-cleaning': '🧼 Limpeza profunda',
      construction: '🏗️ Limpeza pós-obra', movein: '🚚 Limpeza de entrada/saída',
      laundry: '👕 Lavandaria e engomadoria', closet: '👚 Organização de armários',
      organization: '🧺 Organização da casa', garage: '📦 Organização de garagem',
      holiday: '🎄 Decoração festiva', staging: '🏠 Home staging', other: '✨ Outro'
    };

    async function request(action) {
      const response = await fetch(reviewsEndpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, token, action }), cache: 'no-store'
      });
      if (!response.ok) throw new Error('Não foi possível abrir esta ligação. Verifique se já foi apagado ou tente novamente.');
      return response.json();
    }

    async function load() {
      if (!id || !token) { status.textContent = 'Abra a ligação privada recebida por email para rever o testemunho.'; return; }
      try {
        const { review } = await request('view');
        for (const key of ['name', 'rating', 'service', 'comment', 'contact']) {
          const values = { name: review.display_name, rating: '✦'.repeat(review.rating) + ` (${review.rating}/5)`,
            service: serviceNames[review.service] || review.service, comment: review.comment, contact: review.contact };
          document.getElementById(key).textContent = values[key];
        }
        approve.hidden = review.status === 'approved';
        document.getElementById('hint').textContent = review.status === 'approved'
          ? 'Já está publicado no site. Pode apagá-lo aqui, inclusive depois do ensaio.'
          : 'Confira o contacto e o comentário antes de publicar. Nada aparece no site até confirmar.';
        section.hidden = false;
        status.textContent = '';
      } catch (error) { status.textContent = error.message; }
    }

    approve.addEventListener('click', async () => {
      approve.disabled = true; remove.disabled = true;
      try {
        await request('approve');
        approve.hidden = true;
        status.textContent = 'Testemunho publicado. Já pode vê-lo no site!';
        document.getElementById('hint').textContent = 'Guarde esta ligação para apagar o testemunho mais tarde.';
      } catch (error) { status.textContent = error.message; }
      finally { approve.disabled = false; remove.disabled = false; }
    });

    remove.addEventListener('click', async () => {
      if (!confirm('Quer apagar este testemunho e o contacto associado?')) return;
      approve.disabled = true; remove.disabled = true;
      try {
        await request('delete');
        section.hidden = true;
        status.textContent = 'Testemunho apagado. Deixou de aparecer no site.';
      } catch (error) { status.textContent = error.message; approve.disabled = false; remove.disabled = false; }
    });
    load();
  </script>
</body>
</html>
